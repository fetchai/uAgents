name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  check-if-files-changed:
    runs-on: ubuntu-latest
    outputs:
      uagents: ${{ steps.files-changed.outputs.uagents }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: files-changed
        with:
          filters: |
            uagents:
              - 'python/**'
              - '.github/**'

  tests:
    name: Tests
    needs: check-if-files-changed

    defaults:
      run:
        shell: bash
        working-directory: ./python
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - if: ${{ needs.check-if-files-changed.outputs.uagents == 'true' }}
        uses: actions/checkout@v4

      - if: ${{ needs.check-if-files-changed.outputs.uagents == 'true' }}
        name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - if: ${{ needs.check-if-files-changed.outputs.uagents == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: python

      - if: ${{ needs.check-if-files-changed.outputs.uagents == 'true' }}
        name: Install dependencies
        run: uv sync --locked
      - if: ${{ needs.check-if-files-changed.outputs.uagents == 'true' }}
        name: Run tests
        run: uv run coverage run -m pytest
        env:
          COVERAGE_FILE: "${{ runner.temp }}/.coverage.${{ runner.os }}.${{ matrix.python-version }}"
      - if: ${{ needs.check-if-files-changed.outputs.uagents == 'true' }}
        name: Store coverage file
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/.coverage.${{ runner.os }}.${{ matrix.python-version }}
          if-no-files-found: error
          include-hidden-files: true

  uagents-adapter-x402:
    name: uAgents Adapter x402
    needs: check-if-files-changed
    if: ${{ needs.check-if-files-changed.outputs.uagents == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./python/uagents-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: python/uagents-adapter
      - name: Install locked x402 dependencies
        run: uv sync --locked --extra x402 --dev
      - name: Run x402 buyer tests
        run: uv run pytest -q tests/test_x402_buyer.py
      - name: Lint x402 buyer
        run: uv run ruff check src/uagents_adapter/x402 tests/test_x402_buyer.py
      - name: Check x402 buyer formatting
        run: uv run ruff format --check src/uagents_adapter/x402 tests/test_x402_buyer.py

  linting:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          src: "python"
          args: "format --check"
          changed-files: "true"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        id: download
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ./python

      - id: count_files
        uses: omagdy7/count_files@v1.0
        with:
          path: ${{ steps.download.outputs.download-path}}

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        if: steps.count_files.outputs.COUNT > 0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COVERAGE_FILES: true
          COVERAGE_PATH: ./python

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
